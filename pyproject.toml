[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-videomobject"
version = "0.1.0"
description = "VideoMobject for Manim CE: play MP4 clips as ImageMobject frame sequences."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "HandiYin" }]
keywords = ["manim", "video", "animation", "videomobject"]
dependencies = [
  "manim>=0.18",
  "numpy",
  "Pillow>=9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/HandiYin/manim-videomobject"
Issues = "https://github.com/HandiYin/manim-videomobject/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
